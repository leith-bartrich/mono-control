# Dev-time-only overlay, merged on top of docker-compose.yml by VS Code via the
# dockerComposeFile array in devcontainer.json. Everything here exists ONLY during
# interactive development; the headless `mproj` shim runs the base file alone.
#
# Step 2 removes ALL workspace bind mounts. The container no longer touches
# git / the filesystem / mono-config directly — it performs every effect over the
# host-side broker (JSON-RPC, injected by the shim as MONO_BROKER_*). So the
# sibling mono-config / mono-repos / mono-repos-offline mounts are gone; git runs
# natively on the host, and the container holds no token and needs no workspace.
#
# What remains:
#   - mono-control: bind LIVE source over the image's baked-in copy, so edits are
#     immediate (the baked code is shadowed while this mount is present).
#   - mono-control-claude: persist Claude Code auth + history across rebuilds. A
#     static volume name keeps each developer's copy local to their machine.
#     postCreateCommand chowns it to codespace (named volumes mount root-owned).
#
# Relative sources resolve from this file's directory (.devcontainer): `..` is the
# mono-control root.
services:
  mono-control:
    volumes:
      - ..:/workspaces/mono-control
      - mono-control-claude:/home/codespace/.claude

volumes:
  mono-control-claude:
