# Source of truth for the mono-control container — the pure, self-contained built
# tool, shared by both use modes:
#
#   Mode 1 (interactive dev): devcontainer.json layers docker-compose.devcontainer.yml
#     on top of this, bind-mounting live source only (for edit-immediacy).
#   Mode 2 (headless): the host `mproj` shim runs `docker compose run --rm` against
#     THIS file alone.
#
# Step 2: the container performs NO git / filesystem / mono-config effects itself —
# it calls back to a host-side broker over JSON-RPC. The shim stands up that broker
# and injects its coordinates (MONO_BROKER_HOST / PORT / TOKEN) per run; git runs
# natively on the host. So there are NO workspace bind mounts in EITHER mode, and
# the container holds no credential. mono-control itself is baked INTO the image
# (see the Dockerfile), so it needs no source mount in the headless path.
services:
  mono-control:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    user: codespace
    working_dir: /workspaces/mono-control
    # Keep the container alive for VS Code to attach. Mode 2's
    # `docker compose run --rm` overrides this with the real command.
    command: sleep infinity
    environment:
      # Host-platform hint (see docs/design/host-platform.md). Interpolated from an
      # overriding host env / .env, falling back to `generic` (the image's baked
      # default); the shim's per-call `-e` overrides it.
      #
      # NOTE: there is deliberately NO MONO_CONTROL_IN_CONTAINER here. The sandbox
      # gate is a marker FILE baked into the image (see _build/gate.py and
      # src/mono_control/sandbox.py) — an env var cannot fake it and a host checkout
      # never carries it. An env sentinel would be inert.
      MONO_CONTROL_HOST_PLATFORM: "${MONO_CONTROL_HOST_PLATFORM:-generic}"
