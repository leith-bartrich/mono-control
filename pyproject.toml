[build-system]
requires = ["hatchling"]
# In-tree build backend (see _build/gate.py). It wraps hatchling but refuses to
# build outside the dev container — the install-time half of the sandbox gate.
build-backend = "gate"
backend-path = ["_build"]

[project]
name = "mono-control"
version = "0.0.0"
description = "Repo state manager for the fiemono workspace — brings managed repos to a declared state."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bradley Friedman" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "typer>=0.12",
    "click>=8.1",
    "rich>=13",
    "questionary>=2",
]

[project.scripts]
mono-control = "mono_control.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mono_control"]

[dependency-groups]
dev = ["pytest"]
